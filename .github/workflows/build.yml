name: Compilar o livro

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compilar com latexmk
        uses: xu-cheng/latex-action@v3
        with:
          root_file: livro/main.tex
          latexmk_shell_escape: false
          args: -pdf -bibtex -outdir=build -file-line-error -interaction=nonstopmode

      - name: Verificar o resultado
        run: |
          test -f build/main.pdf || { echo "build/main.pdf nao foi gerado"; exit 1; }
          indef=$(grep -c 'undefined' build/main.log || true)
          echo "Referencias indefinidas: $indef"
          echo "Paginas: $(sed -n 's/.*main\.pdf (\([0-9][0-9]*\) pages.*/\1/p' build/main.log | tail -1)"
          if [ "$indef" -gt 0 ]; then
            grep -n 'undefined' build/main.log
            exit 1
          fi

      - name: Preparar o PDF distribuível
        run: |
          mkdir -p dist
          cp build/main.pdf dist/Aprendizado-de-Mundo-Aberto-em-Petroleo.pdf

      - name: Armazenar o PDF como artefato
        uses: actions/upload-artifact@v7
        with:
          name: livro-pdf
          path: dist/Aprendizado-de-Mundo-Aberto-em-Petroleo.pdf

      - name: Anexar o PDF ao release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/Aprendizado-de-Mundo-Aberto-em-Petroleo.pdf
