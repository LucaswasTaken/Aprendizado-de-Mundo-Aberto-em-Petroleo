name: Compilar o livro

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compilar com latexmk
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_shell_escape: false
          args: -pdf -bibtex -file-line-error -interaction=nonstopmode

      - name: Verificar o resultado
        run: |
          test -f main.pdf || { echo "main.pdf nao foi gerado"; exit 1; }
          indef=$(grep -c 'undefined' main.log || true)
          echo "Referencias indefinidas: $indef"
          echo "Paginas: $(grep -o 'Output written on main.pdf ([0-9]*' main.log | grep -o '[0-9]*$')"
          if [ "$indef" -gt 0 ]; then
            grep -n 'undefined' main.log
            exit 1
          fi

      - name: Publicar o PDF como artefato
        uses: actions/upload-artifact@v4
        with:
          name: livro-pdf
          path: main.pdf

      - name: Anexar o PDF ao release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: main.pdf
